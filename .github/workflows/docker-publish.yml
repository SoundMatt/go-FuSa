name: Docker Publish

on:
  push:
    tags:
      - "v*"

jobs:
  push:
    name: Build and push ghcr.io/soundmatt/go-fusa
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/soundmatt/go-fusa
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Derive version metadata for image labels
        id: version
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "spec_version=$(grep -m1 'const SpecVersion' fusa.go | sed -E 's/.*"(.*)".*/\1/')" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            SPEC_VERSION=${{ steps.version.outputs.spec_version }}

      - name: Notify FuSaOps
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.FUSAOPS_DISPATCH_TOKEN }}
          repository: SoundMatt/FuSaOps
          event-type: xfusa-released
          client-payload: '{"tool":"go-FuSa","version":"${{ github.ref_name }}"}'
        continue-on-error: true
